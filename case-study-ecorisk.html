<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRisk case study — Amanda Freitas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
  /* ================= VIVA — design tokens (fonte: Viva / tokens.json) ================= */
  :root{
    /* cor */
    --fundo:#FAF7FC;
    --superficie:#FFFFFF;
    --tinta:#2A2033;
    --tinta-suave:#5E5468;
    --borda:#E7E0EC;
    --borda-controle:#8C8296;
    --quaresmeira:#6B3FA0;
    --quaresmeira-escura:#4E2A7A;
    --lavanda:#B9A3D9;
    --manaca:#EFE8F7;
    --folha:#2F6B4F;
    --folha-clara:#DDEBE0;
    --musgo:#1F3D30;
    --polen:#E3B04B;
    --erro:#B3261E;

    /* tipografia */
    --font-serif:Fraunces, Georgia, "Times New Roman", serif;
    --font-sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    /* espaço */
    --espaco-1:4px;
    --espaco-2:8px;
    --espaco-3:12px;
    --espaco-4:16px;
    --espaco-6:24px;
    --espaco-8:32px;
    --espaco-12:48px;
    --espaco-16:64px;

    /* raio */
    --raio-sm:6px;
    --raio-md:12px;
    --raio-lg:24px;
    --raio-pilula:999px;

    /* sombra */
    --sombra-suave:0 1px 2px rgba(42,32,51,0.06), 0 4px 12px rgba(42,32,51,0.06);
    --sombra-flutuante:0 12px 32px rgba(42,32,51,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    background:var(--fundo);
    color:var(--tinta);
    font-family:var(--font-sans);
    font-size:16px;
    line-height:26px;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  /* foco visível: anel de 2px em quaresmeira, 2px de afastamento */
  a:focus-visible,
  button:focus-visible{
    outline:2px solid var(--quaresmeira);
    outline-offset:2px;
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 var(--espaco-16);
  }

  /* ---------- TOP BAR (matches home) ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:var(--espaco-8) var(--espaco-16);
  }

  .name{
    font-family:var(--font-serif);
    font-size:22px;
    line-height:30px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-decoration:none;
  }

  .topbar-right{
    display:flex;
    align-items:center;
    gap:var(--espaco-4);
  }

  .lang-switch{
    display:flex;
    align-items:center;
    gap:var(--espaco-2);
    font-size:13px;
    font-weight:500;
  }

  .lang-sep{
    color:var(--borda-controle);
  }

  .lang-btn{
    background:none;
    border:none;
    padding:2px 1px;
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:500;
    color:var(--tinta-suave);
    cursor:pointer;
    border-radius:var(--raio-sm);
    transition:color .18s ease-out;
  }

  .lang-btn:hover{
    color:var(--quaresmeira);
  }

  .lang-btn.is-active{
    color:var(--tinta);
    font-weight:600;
    text-decoration:underline;
    text-decoration-color:var(--lavanda);
    text-decoration-thickness:1.5px;
    text-underline-offset:5px;
  }

  /* LinkSeta-style text links */
  .back-link,
  .gate-back,
  .cs-nav a{
    color:var(--quaresmeira);
    font-size:15px;
    font-weight:500;
    text-decoration:underline;
    text-decoration-color:var(--lavanda);
    text-decoration-thickness:1.5px;
    text-underline-offset:5px;
    border-radius:var(--raio-sm);
    transition:color .18s ease-out;
  }
  .back-link:hover,
  .gate-back:hover,
  .cs-nav a:hover{
    color:var(--quaresmeira-escura);
    text-decoration-color:currentColor;
  }

  /* ================= PASSWORD GATE ================= */
  .gate{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:var(--espaco-12) var(--espaco-6);
  }

  .gate-card{
    width:100%;
    max-width:420px;
    text-align:left;
  }

  /* sobretítulo */
  .gate-label-top{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-3);
  }

  .gate-card h1{
    font-family:var(--font-serif);
    font-size:32px;
    line-height:40px;
    font-weight:500;
    letter-spacing:-0.01em;
    margin-bottom:var(--espaco-3);
  }

  .gate-card p.intro{
    font-size:16px;
    line-height:26px;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-8);
  }

  .field-label{
    display:block;
    font-size:15px;
    line-height:20px;
    font-weight:500;
    color:var(--tinta);
    margin-bottom:var(--espaco-2);
  }

  .field-row{
    position:relative;
    display:flex;
    align-items:center;
    background:var(--superficie);
    border:1px solid var(--borda-controle);
    border-radius:var(--raio-md);
    transition:border-color .18s ease-out;
  }

  .field-row:focus-within{
    border-color:var(--quaresmeira);
    outline:2px solid var(--quaresmeira);
    outline-offset:2px;
  }

  .field-row input{
    flex:1;
    min-height:44px;
    border:none;
    background:none;
    outline:none;
    padding:0 var(--espaco-4);
    font-family:var(--font-sans);
    font-size:16px;
    color:var(--tinta);
  }

  .toggle-visibility{
    background:none;
    border:none;
    cursor:pointer;
    padding:0 var(--espaco-4);
    min-height:44px;
    display:flex;
    align-items:center;
    color:var(--tinta-suave);
    border-radius:var(--raio-md);
    transition:color .18s ease-out;
  }
  .toggle-visibility:hover{ color:var(--quaresmeira); }
  .toggle-visibility svg{ width:20px; height:20px; }

  .gate-error{
    display:none;
    align-items:center;
    gap:var(--espaco-2);
    margin-top:var(--espaco-3);
    font-size:14px;
    line-height:22px;
    font-weight:500;
    color:var(--erro);
  }
  .gate-error.show{ display:flex; }

  /* Botao primário (pílula) */
  .gate-submit{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:44px;
    margin-top:var(--espaco-6);
    padding:0 var(--espaco-6);
    background:var(--quaresmeira);
    color:var(--superficie);
    border:1px solid transparent;
    border-radius:var(--raio-pilula);
    font-family:var(--font-sans);
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background-color .18s ease-out;
  }
  .gate-submit:hover{ background:var(--quaresmeira-escura); }

  .gate-back{
    display:inline-block;
    margin-top:var(--espaco-8);
  }

  /* ================= CASE STUDY CONTENT ================= */
  .case-study{ display:none; }
  .case-study.show{ display:block; }

  .cs-hero{
    padding:var(--espaco-6) 0 var(--espaco-16);
    border-bottom:1px solid var(--borda);
  }

  .cs-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:var(--espaco-2);
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-6);
  }

  .cs-hero h1{
    font-family:var(--font-serif);
    font-size:clamp(36px, 4.6vw, 48px);
    font-weight:400;
    letter-spacing:-0.015em;
    line-height:1.17;
    margin-bottom:var(--espaco-6);
    max-width:18ch;
  }

  .cs-hero .context{
    font-size:18px;
    line-height:28px;
    color:var(--tinta-suave);
    max-width:60ch;
    margin-bottom:var(--espaco-8);
  }

  .cs-hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:var(--espaco-8);
  }

  .cs-hero-meta div{
    font-size:15px;
    line-height:22px;
  }

  .cs-hero-meta span{
    display:block;
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-1);
  }

  .cs-hero-note{
    margin-top:var(--espaco-8);
    font-size:14px;
    line-height:22px;
    color:var(--tinta-suave);
    font-style:italic;
    max-width:65ch;
  }

  .cs-section{
    padding:var(--espaco-16) 0;
    border-bottom:1px solid var(--borda);
  }

  .cs-section:last-of-type{
    border-bottom:none;
  }

  .cs-section h2{
    font-family:var(--font-serif);
    font-size:clamp(28px, 3vw, 32px);
    line-height:1.25;
    font-weight:500;
    letter-spacing:-0.01em;
    margin-bottom:var(--espaco-6);
  }

  .cs-section p{
    font-size:16px;
    line-height:26px;
    color:var(--tinta-suave);
    max-width:68ch;
    margin-bottom:var(--espaco-4);
  }

  .cs-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:var(--espaco-4);
    margin-top:var(--espaco-8);
  }

  .cs-stat{
    padding:var(--espaco-6);
    background:var(--manaca);
    border-radius:var(--raio-md);
  }

  .cs-stat .value{
    font-family:var(--font-serif);
    font-size:32px;
    line-height:40px;
    font-weight:500;
    color:var(--quaresmeira-escura);
    display:block;
    margin-bottom:var(--espaco-1);
  }

  .cs-stat .label{
    font-size:14px;
    line-height:22px;
    color:var(--tinta-suave);
  }

  .cs-subheading{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin:var(--espaco-8) 0 var(--espaco-4);
  }

  .cs-triple{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:var(--espaco-6);
  }

  .cs-triple-item h3{
    font-size:18px;
    line-height:26px;
    font-weight:600;
    margin-bottom:var(--espaco-2);
  }

  .cs-triple-item p{
    font-size:14px;
    line-height:22px;
    margin-bottom:0;
  }

  .cs-journey-steps{
    display:flex;
    flex-direction:column;
    gap:var(--espaco-3);
    margin-top:var(--espaco-6);
    counter-reset:step;
  }

  .cs-journey-steps li{
    list-style:none;
    display:flex;
    gap:var(--espaco-4);
    align-items:flex-start;
    font-size:16px;
    line-height:26px;
    color:var(--tinta-suave);
    padding:var(--espaco-3) 0;
    border-bottom:1px solid var(--borda);
  }

  .cs-journey-steps li::before{
    counter-increment:step;
    content:counter(step);
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--quaresmeira);
    color:var(--superficie);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .cs-decision{
    margin-bottom:var(--espaco-16);
  }

  .cs-decision:last-child{
    margin-bottom:0;
  }

  .cs-decision h3{
    font-family:var(--font-serif);
    font-size:24px;
    line-height:32px;
    font-weight:500;
    margin-bottom:var(--espaco-3);
  }

  .cs-decision img{
    width:100%;
    height:auto;
    display:block;
    border:1px solid var(--borda);
    border-radius:var(--raio-md);
    margin:var(--espaco-6) 0 var(--espaco-3);
  }

  .cs-decision .caption{
    font-size:14px;
    color:var(--tinta-suave);
    line-height:22px;
    max-width:70ch;
  }

  .cs-outcomes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:var(--espaco-8);
    margin-top:var(--espaco-2);
  }

  .cs-outcome-block h4{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-4);
  }

  .cs-closing-quote{
    font-family:var(--font-serif);
    font-size:24px;
    font-weight:400;
    line-height:1.4;
    color:var(--tinta);
    max-width:56ch;
    margin-bottom:var(--espaco-6);
  }

  .cs-closing-quote b{ color:var(--quaresmeira); font-weight:500; }

  .cs-nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:var(--espaco-4);
    padding:var(--espaco-16) 0 var(--espaco-16);
  }

  .cs-nav-links{
    display:flex;
    gap:var(--espaco-8);
  }

  @media (max-width:820px){
    .topbar{ padding:var(--espaco-6); flex-direction:column; align-items:flex-start; gap:var(--espaco-3); }
    .topbar-right{ flex-direction:column; align-items:flex-start; gap:var(--espaco-2); }
    .wrap{ padding:0 var(--espaco-6); }
    .cs-hero{ padding:0 0 var(--espaco-12); }
    .cs-section{ padding:var(--espaco-12) 0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="name" data-i18n="nav.name">Amanda Freitas</a>
  <div class="topbar-right">
    <a href="index.html#projects" class="back-link" data-i18n="case.backToProjects">← Back to Projects</a>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.switcherLabel" aria-label="Language">
      <button type="button" class="lang-btn" data-lang-btn="en" aria-pressed="false" data-i18n="lang.en">English</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-btn" data-lang-btn="pt-BR" aria-pressed="false" data-i18n="lang.ptBR">Português (Brasil)</button>
    </div>
  </div>
</header>

<!-- ================= PASSWORD GATE ================= -->
<main class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-label-top" data-i18n="case.gate.label">Protected case study</div>
    <h1 data-i18n="case.gate.heading">This case study is password-protected.</h1>
    <p class="intro" data-i18n="case.gate.intro">Enter the password shared with you to view the EcoRisk case study.</p>

    <form id="gateForm" novalidate>
      <label class="field-label" for="passwordInput" data-i18n="case.gate.passwordLabel">Password</label>
      <div class="field-row">
        <input
          type="password"
          id="passwordInput"
          name="password"
          autocomplete="off"
          aria-describedby="gateError"
          aria-invalid="false"
        >
        <button type="button" class="toggle-visibility" id="toggleVisibility" aria-label="Show password" aria-pressed="false" data-i18n-attr="aria-label:case.gate.showPassword">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
      </div>

      <div class="gate-error" id="gateError" role="alert">
        <span data-i18n="case.gate.errorWrong">Incorrect password. Please try again.</span>
      </div>

      <button type="submit" class="gate-submit" data-i18n="case.gate.submit">Unlock case study</button>
    </form>

    <a href="index.html#projects" class="gate-back" data-i18n="case.backToProjects">← Back to Projects</a>
  </div>
</main>

<!-- ================= PROTECTED CASE STUDY CONTENT ================= -->
<!-- This container starts empty. Content is only fetched and rendered
     into it after a correct password is submitted. See note in the
     script below about the limitations of this approach. -->
<article class="case-study" id="caseStudy">
  <div class="wrap" id="caseStudyContent"></div>

  <div class="wrap">
    <nav class="cs-nav" data-i18n-attr="aria-label:case.nav.ariaLabel" aria-label="Case study navigation">
      <a href="index.html#projects" data-i18n="case.backToProjects">← Back to Projects</a>
      <div class="cs-nav-links">
        <a href="index.html" data-i18n="case.backToHome">Back to home</a>
      </div>
    </nav>
  </div>
</article>

<script src="i18n/i18n.js"></script>
<script>
  // Keep the document title in sync with the active locale.
  var CASE_PAGE_TITLES = { en: "EcoRisk case study — Amanda Freitas", "pt-BR": "Case EcoRisk — Amanda Freitas" };
  document.addEventListener('localechange', function (e) {
    document.title = CASE_PAGE_TITLES[e.detail.locale] || document.title;
  });
</script>
<script>
  /* =========================================================
     PASSWORD GATE
     ---------------------------------------------------------
     IMPORTANT — read before relying on this for real protection:

     This is a STATIC, front-end-only site (no server, no backend,
     no auth provider). That means there is no way to truly hide
     content from someone determined to access it — anyone can open
     browser dev tools, inspect network requests, or read this
     script's logic.

     What this implementation DOES do, within those constraints:
       - The protected case-study text/images are NOT included in
         this page's initial HTML. They live in a separate JSON file
         (case-study-ecorisk-data.json) that is only fetched AFTER
         a correct password is entered. So a casual "view source" or
         search-engine crawl will not surface the content.
       - The password itself is never stored in plaintext in this
         file — only its SHA-256 hash is compared client-side, so a
         quick "view-source" search for the password string won't
         reveal it.
       - Access is remembered for the browser session via
         sessionStorage, so the user isn't re-prompted on refresh,
         but it clears when the tab/browser is closed.

     What this does NOT do:
       - It does NOT prevent someone with technical knowledge from
         fetching case-study-ecorisk-data.json directly by URL, or
         from brute-forcing the hash offline.
       - It is a lightweight ACCESS GATE for casual/unlinked-content
         purposes (e.g. keeping a case study out of search engines
         and off casual browsing), not real security.

     For genuine protection, this would need a server-side check —
     e.g. a Vercel Edge Middleware / serverless function that checks
     the password server-side before ever sending the case-study
     content to the browser. If/when the hosting setup supports that,
     this client-side gate should be replaced with it.
     ========================================================= */

  const PASSWORD_HASH = "37ae240244f300205edbbae2d790fa76351668469f9f37c968536b7843272a35";
  const SESSION_KEY = "ecorisk_case_unlocked";

  // One data file per locale. Language never changes the password or the
  // session-unlocked state below -- it only changes which JSON gets fetched
  // and re-rendered once access has already been granted.
  function dataUrlForLocale(locale){
    return locale === 'pt-BR'
      ? './case-study-ecorisk-data.pt-BR.json'
      : './case-study-ecorisk-data.en.json';
  }

  let lastRenderedData = null; // cached so a language switch can re-render without re-auth

  const gate = document.getElementById('gate');
  const caseStudy = document.getElementById('caseStudy');
  const caseStudyContent = document.getElementById('caseStudyContent');
  const form = document.getElementById('gateForm');
  const input = document.getElementById('passwordInput');
  const errorEl = document.getElementById('gateError');
  const toggleBtn = document.getElementById('toggleVisibility');

  async function sha256Hex(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderCaseStudy(data){
    const h = data.hero, c = data.challenge, p = data.process, j = data.journey, d = data.decisions, o = data.outcomes;

    const statsHtml = c.stats.map(s => `
      <div class="cs-stat">
        <span class="value">${escapeHtml(s.value)}</span>
        <span class="label">${escapeHtml(s.label)}</span>
      </div>`).join('');

    const uncertaintyHtml = c.costOfUncertainty.map(u => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(u.title)}</h3>
        <p>${escapeHtml(u.desc)}</p>
      </div>`).join('');

    const pillarsHtml = p.pillars.map(x => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(x.title)}</h3>
        <p>${escapeHtml(x.desc)}</p>
      </div>`).join('');

    const objectivityHtml = p.objectivity.map(x => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(x.title)}</h3>
        <p>${escapeHtml(x.desc)}</p>
      </div>`).join('');

    const journeyStepsHtml = j.after.map(step => `<li>${escapeHtml(step)}</li>`).join('');

    const decisionsHtml = d.items.map(item => `
      <div class="cs-decision">
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.desc)}</p>
        <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.alt)}" loading="lazy">
        <p class="caption">${escapeHtml(item.caption)}</p>
      </div>`).join('');

    const speedHtml = o.speed.map(s => `
      <p><strong>${escapeHtml(s.label)}:</strong> ${escapeHtml(s.value)}</p>`).join('');

    const businessHtml = o.businessImpact.map(s => `
      <div class="cs-stat">
        <span class="value">${escapeHtml(s.value)}</span>
        <span class="label">${escapeHtml(s.label)}</span>
      </div>`).join('');

    const summaryHtml = o.summary.map(s => `<p>${escapeHtml(s)}</p>`).join('');

    caseStudyContent.innerHTML = `
      <section class="cs-hero">
        <div class="cs-eyebrow">${escapeHtml(h.eyebrow)}</div>
        <h1>${escapeHtml(h.title)}</h1>
        <p class="context">${escapeHtml(h.context)}</p>
        <div class="cs-hero-meta">
          <div><span>Role</span>${escapeHtml(h.role)}</div>
        </div>
        <p class="cs-hero-note">${escapeHtml(h.note)}</p>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(c.heading)}</h2>
        ${c.paragraphs.map(par => `<p>${escapeHtml(par)}</p>`).join('')}
        <div class="cs-stats">${statsHtml}</div>
        <div class="cs-subheading">The cost of uncertainty</div>
        <div class="cs-triple">${uncertaintyHtml}</div>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(p.heading)}</h2>
        <p>${escapeHtml(p.intro)}</p>
        <div class="cs-subheading">Three pillars</div>
        <div class="cs-triple">${pillarsHtml}</div>
        <div class="cs-subheading">Objectivity</div>
        <div class="cs-triple">${objectivityHtml}</div>
        <p style="margin-top:32px;">${escapeHtml(p.validation)}</p>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(j.heading)}</h2>
        <p>${escapeHtml(j.summary)}</p>
        <ol class="cs-journey-steps">${journeyStepsHtml}</ol>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(d.heading)}</h2>
        ${decisionsHtml}
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(o.heading)}</h2>
        <div class="cs-outcomes-grid">
          <div class="cs-outcome-block">
            <h4>Speed and precision</h4>
            ${speedHtml}
          </div>
          <div class="cs-outcome-block">
            <h4>Business impact</h4>
            <div class="cs-stats">${businessHtml}</div>
          </div>
        </div>
        <p class="cs-closing-quote" style="margin-top:48px;">${escapeHtml(o.closing)}</p>
        ${summaryHtml}
      </section>
    `;
  }

  async function unlock(){
    const locale = (window.i18n && window.i18n.getLocale()) || 'en';
    try {
      const res = await fetch(dataUrlForLocale(locale), { cache: 'no-store' });
      if(!res.ok) throw new Error('Could not load case study content.');
      const data = await res.json();
      lastRenderedData = data;
      renderCaseStudy(data);
      gate.style.display = 'none';
      caseStudy.classList.add('show');
    } catch (err){
      showError(t('case.gate.errorLoad'));
    }
  }

  function t(key){
    return (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
  }

  // If the visitor switches language after already unlocking the case
  // study, re-fetch the locale-specific data file and re-render in place.
  // This never touches PASSWORD_HASH or SESSION_KEY -- switching language
  // can't lock or unlock access, it only changes which text is shown.
  document.addEventListener('localechange', function () {
    if (caseStudy.classList.contains('show')) {
      unlock();
    }
  });

  function showError(message){
    errorEl.querySelector('span').textContent = message;
    errorEl.classList.add('show');
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    input.select();
  }

  function clearError(){
    errorEl.classList.remove('show');
    input.setAttribute('aria-invalid', 'false');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const value = input.value.trim();
    if(!value){
      showError(t('case.gate.errorEmpty'));
      return;
    }
    const hash = await sha256Hex(value);
    if(hash === PASSWORD_HASH){
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch(e) { /* storage unavailable, session persistence skipped */ }
      unlock();
    } else {
      showError(t('case.gate.errorWrong'));
    }
  });

  toggleBtn.addEventListener('click', () => {
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-pressed', String(isPassword));
    toggleBtn.setAttribute('aria-label', isPassword ? t('case.gate.hidePassword') : t('case.gate.showPassword'));
    input.focus();
  });

  // Restore access within the same browser session.
  (function checkSession(){
    try {
      if(sessionStorage.getItem(SESSION_KEY) === '1'){
        unlock();
      }
    } catch(e) { /* storage unavailable, always show gate */ }
  })();
</script>

</body>
</html>
