<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inteligência geoespacial para compliance rural — Amanda Freitas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
  /* ================= VIVA — design tokens (fonte: Viva / tokens.json) ================= */
  :root{
    /* cor */
    --fundo:#FAF7FC;
    --superficie:#FFFFFF;
    --tinta:#2A2033;
    --tinta-suave:#5E5468;
    --borda:#E7E0EC;
    --borda-controle:#8C8296;
    --quaresmeira:#6B3FA0;
    --quaresmeira-escura:#4E2A7A;
    --lavanda:#B9A3D9;
    --manaca:#EFE8F7;
    --folha:#2F6B4F;
    --folha-clara:#DDEBE0;
    --musgo:#1F3D30;
    --polen:#E3B04B;
    --erro:#B3261E;

    /* tipografia */
    --font-serif:Fraunces, Georgia, "Times New Roman", serif;
    --font-sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    /* espaço */
    --espaco-1:4px;
    --espaco-2:8px;
    --espaco-3:12px;
    --espaco-4:16px;
    --espaco-6:24px;
    --espaco-8:32px;
    --espaco-12:48px;
    --espaco-16:64px;

    /* raio */
    --raio-sm:6px;
    --raio-md:12px;
    --raio-lg:24px;
    --raio-pilula:999px;

    /* sombra */
    --sombra-suave:0 1px 2px rgba(42,32,51,0.06), 0 4px 12px rgba(42,32,51,0.06);
    --sombra-flutuante:0 12px 32px rgba(42,32,51,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    background:var(--fundo);
    color:var(--tinta);
    font-family:var(--font-sans);
    font-size:16px;
    line-height:26px;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  /* foco visível: anel de 2px em quaresmeira, 2px de afastamento */
  a:focus-visible,
  button:focus-visible{
    outline:2px solid var(--quaresmeira);
    outline-offset:2px;
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 var(--espaco-16);
  }

  /* ---------- TOP BAR (matches home) ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:var(--espaco-8) var(--espaco-16);
  }

  .name{
    font-family:var(--font-serif);
    font-size:22px;
    line-height:30px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-decoration:none;
  }

  .topbar-right{
    display:flex;
    align-items:center;
    gap:var(--espaco-4);
  }

  .lang-switch{
    display:flex;
    align-items:center;
    gap:var(--espaco-2);
    font-size:13px;
    font-weight:500;
  }

  .lang-sep{
    color:var(--borda-controle);
  }

  .lang-btn{
    background:none;
    border:none;
    padding:2px 1px;
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:500;
    color:var(--tinta-suave);
    cursor:pointer;
    border-radius:var(--raio-sm);
    transition:color .18s ease-out;
  }

  .lang-btn:hover{
    color:var(--quaresmeira);
  }

  .lang-btn.is-active{
    color:var(--tinta);
    font-weight:600;
    text-decoration:underline;
    text-decoration-color:var(--lavanda);
    text-decoration-thickness:1.5px;
    text-underline-offset:5px;
  }

  /* LinkSeta-style text links */
  .back-link,
  .cs-nav a{
    color:var(--quaresmeira);
    font-size:15px;
    font-weight:500;
    text-decoration:underline;
    text-decoration-color:var(--lavanda);
    text-decoration-thickness:1.5px;
    text-underline-offset:5px;
    border-radius:var(--raio-sm);
    transition:color .18s ease-out;
  }
  .back-link:hover,
  .cs-nav a:hover{
    color:var(--quaresmeira-escura);
    text-decoration-color:currentColor;
  }

  /* ================= CASE STUDY CONTENT ================= */
  .case-study{ display:none; }
  .case-study.show{ display:block; }

  .cs-hero{
    padding:var(--espaco-6) 0 var(--espaco-16);
    border-bottom:1px solid var(--borda);
  }

  .cs-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:var(--espaco-2);
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-6);
  }

  .cs-hero h1{
    font-family:var(--font-serif);
    font-size:clamp(36px, 4.6vw, 48px);
    font-weight:400;
    letter-spacing:-0.015em;
    line-height:1.17;
    margin-bottom:var(--espaco-6);
    max-width:18ch;
  }

  .cs-hero .context{
    font-size:18px;
    line-height:28px;
    color:var(--tinta-suave);
    max-width:60ch;
    margin-bottom:var(--espaco-8);
  }

  .cs-hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:var(--espaco-8);
  }

  .cs-hero-meta div{
    font-size:15px;
    line-height:22px;
  }

  .cs-hero-meta span{
    display:block;
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-1);
  }

  .cs-hero-note{
    margin-top:var(--espaco-8);
    font-size:14px;
    line-height:22px;
    color:var(--tinta-suave);
    font-style:italic;
    max-width:65ch;
  }

  .cs-section{
    padding:var(--espaco-16) 0;
    border-bottom:1px solid var(--borda);
  }

  .cs-section:last-of-type{
    border-bottom:none;
  }

  .cs-section h2{
    font-family:var(--font-serif);
    font-size:clamp(28px, 3vw, 32px);
    line-height:1.25;
    font-weight:500;
    letter-spacing:-0.01em;
    margin-bottom:var(--espaco-6);
  }

  .cs-section p{
    font-size:16px;
    line-height:26px;
    color:var(--tinta-suave);
    max-width:68ch;
    margin-bottom:var(--espaco-4);
  }

  .cs-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:var(--espaco-4);
    margin-top:var(--espaco-8);
  }

  .cs-stat{
    padding:var(--espaco-6);
    background:var(--manaca);
    border-radius:var(--raio-md);
  }

  .cs-stat .value{
    font-family:var(--font-serif);
    font-size:32px;
    line-height:40px;
    font-weight:500;
    color:var(--quaresmeira-escura);
    display:block;
    margin-bottom:var(--espaco-1);
  }

  .cs-stat .label{
    font-size:14px;
    line-height:22px;
    color:var(--tinta-suave);
  }

  .cs-subheading{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin:var(--espaco-8) 0 var(--espaco-4);
  }

  .cs-triple{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:var(--espaco-6);
  }

  .cs-triple-item h3{
    font-size:18px;
    line-height:26px;
    font-weight:600;
    margin-bottom:var(--espaco-2);
  }

  .cs-triple-item p{
    font-size:14px;
    line-height:22px;
    margin-bottom:0;
  }

  .cs-journey-steps{
    display:flex;
    flex-direction:column;
    gap:var(--espaco-3);
    margin-top:var(--espaco-6);
    counter-reset:step;
  }

  .cs-journey-steps li{
    list-style:none;
    display:flex;
    gap:var(--espaco-4);
    align-items:flex-start;
    font-size:16px;
    line-height:26px;
    color:var(--tinta-suave);
    padding:var(--espaco-3) 0;
    border-bottom:1px solid var(--borda);
  }

  .cs-journey-steps li::before{
    counter-increment:step;
    content:counter(step);
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--quaresmeira);
    color:var(--superficie);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .cs-decision{
    margin-bottom:var(--espaco-16);
  }

  .cs-decision:last-child{
    margin-bottom:0;
  }

  .cs-decision h3{
    font-family:var(--font-serif);
    font-size:24px;
    line-height:32px;
    font-weight:500;
    margin-bottom:var(--espaco-3);
  }

  .cs-decision img{
    width:100%;
    height:auto;
    display:block;
    border:1px solid var(--borda);
    border-radius:var(--raio-md);
    margin:var(--espaco-6) 0 var(--espaco-3);
  }

  .cs-decision .caption{
    font-size:14px;
    color:var(--tinta-suave);
    line-height:22px;
    max-width:70ch;
  }

  .cs-outcomes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:var(--espaco-8);
    margin-top:var(--espaco-2);
  }

  .cs-outcome-block h4{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    margin-bottom:var(--espaco-4);
  }

  .cs-closing-quote{
    font-family:var(--font-serif);
    font-size:24px;
    font-weight:400;
    line-height:1.4;
    color:var(--tinta);
    max-width:56ch;
    margin-bottom:var(--espaco-6);
  }

  .cs-closing-quote b{ color:var(--quaresmeira); font-weight:500; }

  .cs-nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:var(--espaco-4);
    padding:var(--espaco-16) 0 var(--espaco-16);
  }

  .cs-nav-links{
    display:flex;
    gap:var(--espaco-8);
  }

  @media (max-width:820px){
    .topbar{ padding:var(--espaco-6); flex-direction:column; align-items:flex-start; gap:var(--espaco-3); }
    .topbar-right{ flex-direction:column; align-items:flex-start; gap:var(--espaco-2); }
    .wrap{ padding:0 var(--espaco-6); }
    .cs-hero{ padding:0 0 var(--espaco-12); }
    .cs-section{ padding:var(--espaco-12) 0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="name" data-i18n="nav.name">Amanda Freitas</a>
  <div class="topbar-right">
    <a href="index.html#projects" class="back-link" data-i18n="case.backToProjects">← Voltar para Projetos</a>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.switcherLabel" aria-label="Idioma">
      <button type="button" class="lang-btn" data-lang-btn="en" aria-pressed="false" data-i18n="lang.en">English</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-btn" data-lang-btn="pt-BR" aria-pressed="false" data-i18n="lang.ptBR">Português (Brasil)</button>
    </div>
  </div>
</header>

<!-- ================= CASE STUDY CONTENT ================= -->
<article class="case-study show" id="caseStudy">
  <div class="wrap" id="caseStudyContent"></div>

  <div class="wrap">
    <nav class="cs-nav" data-i18n-attr="aria-label:case.nav.ariaLabel" aria-label="Navegação do case">
      <a href="index.html#projects" data-i18n="case.backToProjects">← Voltar para Projetos</a>
      <div class="cs-nav-links">
        <a href="index.html" data-i18n="case.backToHome">Voltar para o início</a>
      </div>
    </nav>
  </div>
</article>

<script src="i18n/i18n.js"></script>
<script>
  // Keep the document title in sync with the active locale.
  var CASE_PAGE_TITLES = { en: "EcoRisk case study — Amanda Freitas", "pt-BR": "Inteligência geoespacial para compliance rural — Amanda Freitas" };
  document.addEventListener('localechange', function (e) {
    document.title = CASE_PAGE_TITLES[e.detail.locale] || document.title;
  });
</script>
<script>
  // One data file per locale; switching language re-fetches and re-renders in place.
  function dataUrlForLocale(locale){
    return locale === 'pt-BR'
      ? './case-study-ecorisk-data.pt-BR.json'
      : './case-study-ecorisk-data.en.json';
  }

  const caseStudyContent = document.getElementById('caseStudyContent');

  function t(key){
    return (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderCaseStudy(data){
    const h = data.hero, c = data.challenge, p = data.process, j = data.journey, d = data.decisions, o = data.outcomes;

    const statsHtml = c.stats.map(s => `
      <div class="cs-stat">
        <span class="value">${escapeHtml(s.value)}</span>
        <span class="label">${escapeHtml(s.label)}</span>
      </div>`).join('');

    const uncertaintyHtml = c.costOfUncertainty.map(u => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(u.title)}</h3>
        <p>${escapeHtml(u.desc)}</p>
      </div>`).join('');

    const pillarsHtml = p.pillars.map(x => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(x.title)}</h3>
        <p>${escapeHtml(x.desc)}</p>
      </div>`).join('');

    const objectivityHtml = p.objectivity.map(x => `
      <div class="cs-triple-item">
        <h3>${escapeHtml(x.title)}</h3>
        <p>${escapeHtml(x.desc)}</p>
      </div>`).join('');

    const journeyStepsHtml = j.after.map(step => `<li>${escapeHtml(step)}</li>`).join('');

    const decisionsHtml = d.items.map(item => `
      <div class="cs-decision">
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.desc)}</p>
        <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.alt)}" loading="lazy">
        <p class="caption">${escapeHtml(item.caption)}</p>
      </div>`).join('');

    const speedHtml = o.speed.map(s => `
      <p><strong>${escapeHtml(s.label)}:</strong> ${escapeHtml(s.value)}</p>`).join('');

    const businessHtml = o.businessImpact.map(s => `
      <div class="cs-stat">
        <span class="value">${escapeHtml(s.value)}</span>
        <span class="label">${escapeHtml(s.label)}</span>
      </div>`).join('');

    const summaryHtml = o.summary.map(s => `<p>${escapeHtml(s)}</p>`).join('');

    caseStudyContent.innerHTML = `
      <section class="cs-hero">
        <h1>${escapeHtml(h.title)}</h1>
        <p class="context">${escapeHtml(h.context)}</p>
        <p class="cs-hero-note">${escapeHtml(h.note)}</p>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(c.heading)}</h2>
        ${c.paragraphs.map(par => `<p>${escapeHtml(par)}</p>`).join('')}
        <div class="cs-stats">${statsHtml}</div>
        <div class="cs-subheading">${escapeHtml(window.i18n.t('case.sub.uncertainty'))}</div>
        <div class="cs-triple">${uncertaintyHtml}</div>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(p.heading)}</h2>
        <p>${escapeHtml(p.intro)}</p>
        <div class="cs-subheading">${escapeHtml(window.i18n.t('case.sub.pillars'))}</div>
        <div class="cs-triple">${pillarsHtml}</div>
        <div class="cs-subheading">${escapeHtml(window.i18n.t('case.sub.objectivity'))}</div>
        <div class="cs-triple">${objectivityHtml}</div>
        <p style="margin-top:32px;">${escapeHtml(p.validation)}</p>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(j.heading)}</h2>
        <p>${escapeHtml(j.summary)}</p>
        <ol class="cs-journey-steps">${journeyStepsHtml}</ol>
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(d.heading)}</h2>
        ${decisionsHtml}
      </section>

      <section class="cs-section">
        <h2>${escapeHtml(o.heading)}</h2>
        <div class="cs-outcomes-grid">
          <div class="cs-outcome-block">
            <h4>Speed and precision</h4>
            ${speedHtml}
          </div>
          <div class="cs-outcome-block">
            <h4>Business impact</h4>
            <div class="cs-stats">${businessHtml}</div>
          </div>
        </div>
        <p class="cs-closing-quote" style="margin-top:48px;">${escapeHtml(o.closing)}</p>
        ${summaryHtml}
      </section>
    `;
  }

  async function loadCase(){
    const locale = (window.i18n && window.i18n.getLocale()) || 'pt-BR';
    try {
      const res = await fetch(dataUrlForLocale(locale), { cache: 'no-store' });
      if(!res.ok) throw new Error('Could not load case study content.');
      renderCaseStudy(await res.json());
    } catch (err){
      caseStudyContent.textContent = t('case.gate.errorLoad');
    }
  }

  // i18n.js fires "localechange" after the first dictionary load and on every switch.
  document.addEventListener('localechange', loadCase);
</script>

</body>
</html>
